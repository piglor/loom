# Advanced standalone OpenBao module. The easy Loom/Coolify Compose includes
# the equivalent service directly; use this descriptor when OpenBao should run
# as a separate Compose project or on a separate host.
services:
  openbao:
    build:
      context: ../..
      dockerfile: deploy/openbao/Dockerfile
    image: loom-openbao:local
    command: ["server"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      SKIP_CHOWN: "1"
    volumes:
      - openbao-data:/openbao/data
      - openbao-audit:/openbao/logs
    expose: [8200]
    networks: [openbao]
    labels:
      traefik.enable: "false"
    healthcheck:
      # /sys/health reports sealed (503) and uninitialized (501) as reachable
      # states. Bootstrap is an operator action and must not look dead.
      test:
        - CMD-SHELL
        - >-
          code=$$(wget -q -O /dev/null --server-response
          http://127.0.0.1:8200/v1/sys/health 2>&1 |
          awk '/^ *HTTP\// { code=$$2 } END { print code }');
          test "$$code" = 200 -o "$$code" = 429 -o "$$code" = 501 -o "$$code" = 503
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  openbao-data:
  openbao-audit:

networks:
  openbao:
    internal: true
