# Overlay for a single-host Loom Lite deployment. Compose's include keeps the
# OpenBao subsystem self-contained while this file only wires the application
# to its internal address.
include:
  - ../openbao/compose.yaml

services:
  loom-server:
    environment:
      LOOM_OPENBAO_ADDR: http://openbao:8200
      LOOM_OPENBAO_MOUNT: loom
