# Overlay for a single-host Loom Lite deployment. The base Coolify descriptor
# now carries the pinned, persistent OpenBao service; this file only wires the
# application to it and keeps the dependency optional for Server deployments.
services:
  loom-server:
    environment:
      LOOM_OPENBAO_ADDR: http://openbao:8200
      LOOM_OPENBAO_MOUNT: loom
    depends_on:
      openbao: { condition: service_started }
