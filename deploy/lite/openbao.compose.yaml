# Overlay for a single-host Loom Lite deployment. The standard Coolify Compose
# descriptor already contains the bundled OpenBao service; this overlay only
# makes the internal connection explicit for Lite and keeps the file useful for
# operators composing their own overrides.
services:
  loom-server:
    environment:
      LOOM_OPENBAO_ADDR: http://openbao:8200
      LOOM_OPENBAO_MOUNT: loom
