# Dedicated Coolify resource for OpenBao. Keep this separate from the Loom
# application resource: Coolify injects one resource's .env file into every
# service in that resource and adds its predefined network to each service.
services:
  openbao:
    build:
      context: https://github.com/piglor/loom.git#${LOOM_SOURCE_REF:-main}
      dockerfile: deploy/openbao/Dockerfile
    image: piglor-openbao:local
    command: ["server"]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      BAO_ADDR: http://127.0.0.1:8200
      # Coolify terminates HTTPS at the resource domain. OpenBao uses this
      # advertised URL for redirects and cluster metadata.
      BAO_API_ADDR: ${OPENBAO_API_ADDR:-https://openbao.piglor.com}
      BAO_CLUSTER_ADDR: http://openbao:8201
      SKIP_CHOWN: "1"
    volumes:
      - openbao-data:/openbao/data
      - openbao-audit:/openbao/logs
    expose: [8200]
    networks: [openbao]
    labels:
      traefik.enable: "true"
      traefik.http.services.openbao.loadbalancer.server.port: "8200"
    healthcheck:
      # /sys/health intentionally reports sealed (503) and uninitialized
      # (501) as reachable states. Bootstrap is an operator action and must
      # not be blocked by a readiness check.
      test:
        - CMD-SHELL
        - >-
          code=$$(wget -q -O /dev/null --server-response
          http://127.0.0.1:8200/v1/sys/health 2>&1 |
          awk '/^ *HTTP\// { code=$$2 } END { print code }');
          test "$$code" = 200 -o "$$code" = 429 -o "$$code" = 501 -o "$$code" = 503
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # A tiny, read-only provenance endpoint lets CI prove that the resource it
  # just queued is the revision now serving behind the stable OpenBao domain.
  # Coolify's service API starts Compose services without a deployment UUID,
  # so a health response alone cannot distinguish a new rollout from an old
  # healthy container.
  openbao-provenance:
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LOOM_SOURCE_REF: ${LOOM_SOURCE_REF:-main}
    command:
      - sh
      - -c
      - >-
        printf '%s\n' "$$LOOM_SOURCE_REF" > /tmp/source &&
        exec httpd -f -p 8080 -h /tmp
    expose: [8080]
    tmpfs:
      - /tmp
    networks: [openbao]
    labels:
      traefik.enable: "true"
      traefik.http.routers.openbao-provenance.rule: >-
        Host(`${OPENBAO_DOMAIN:-openbao.piglor.com}`) && PathPrefix(`/_loom/`)
      traefik.http.routers.openbao-provenance.priority: "100"
      traefik.http.routers.openbao-provenance.middlewares: openbao-provenance-strip
      traefik.http.middlewares.openbao-provenance-strip.stripprefix.prefixes: /_loom
      traefik.http.services.openbao-provenance.loadbalancer.server.port: "8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test "$$(wget -q -O - http://127.0.0.1:8080/source)" =
          "$$LOOM_SOURCE_REF"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  openbao-data:
  openbao-audit:

networks:
  openbao:
    internal: true
