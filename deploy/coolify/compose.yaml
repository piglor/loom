# Go control plane with an official Hatchet Go SDK worker. Remote machine Agents
# still connect outbound to loom-server over HTTPS.
x-loom: &loom
  build:
    context: ../..
    dockerfile: services/loom/Dockerfile
  image: piglor-loom:local
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: &environment
    LOOM_DATABASE_URL: postgresql://loom:${LOOM_POSTGRES_PASSWORD:?required}@loom-db:5432/loom
    LOOM_ORGANIZATION: ${LOOM_ORGANIZATION:-local}

services:
  loom-db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: loom
      POSTGRES_DB: loom
      POSTGRES_PASSWORD: ${LOOM_POSTGRES_PASSWORD:?required}
    volumes: [loom-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 10

  loom-migrate:
    <<: *loom
    command: [migrate]
    restart: "no"
    networks: [private]
    depends_on:
      loom-db: { condition: service_healthy }

  loom-server:
    <<: *loom
    command: [serve]
    environment:
      <<: *environment
      LOOM_API_TOKEN: ${LOOM_API_TOKEN:?required}
      LOOM_PUBLIC_URL: ${LOOM_PUBLIC_URL:?required}
      LOOM_OPENBAO_ADDR: ${LOOM_OPENBAO_ADDR:?required}
      LOOM_OPENBAO_MOUNT: ${LOOM_OPENBAO_MOUNT:-loom}
      LOOM_OPENBAO_ROLE_ID: ${LOOM_OPENBAO_ROLE_ID:?required}
      LOOM_OPENBAO_SECRET_ID: ${LOOM_OPENBAO_SECRET_ID:?required}
      LOOM_OPENBAO_CA_CERT: ${LOOM_OPENBAO_CA_CERT:-}
      LOOM_GITHUB_WEBHOOK_SECRET: ${LOOM_GITHUB_WEBHOOK_SECRET:-}
      LOOM_GITHUB_APP_INSTALL_URL: ${LOOM_GITHUB_APP_INSTALL_URL:-}
      LOOM_GITHUB_API_TOKEN: ${LOOM_GITHUB_API_TOKEN:-}
    expose: [8080]
    networks: [private, egress]
    labels:
      # The server has multiple Docker networks. Without this label Traefik may
      # select the private or egress network and return a gateway timeout even
      # while the container-local health check passes.
      traefik.docker.network: ${LOOM_INGRESS_NETWORK:-coolify}
    depends_on:
      loom-migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        - CMD
        - /loom-server
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  loom-worker:
    <<: *loom
    command: [worker]
    environment:
      <<: *environment
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?required}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-https://hatchet.piglor.com}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-engine:7070}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
    networks: [private, hatchet-existing]
    depends_on:
      loom-migrate: { condition: service_completed_successfully }

volumes:
  loom-data:

networks:
  private:
    internal: true
  egress:
  hatchet-existing:
    external: true
    name: ${HATCHET_NETWORK:?set existing Docker network name}
