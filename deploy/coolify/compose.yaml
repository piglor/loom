# Go control plane with an official Hatchet Go SDK worker. Remote machine Agents
# still connect outbound to loom-server over HTTPS.
x-loom: &loom
  build:
    context: ../..
    dockerfile: services/loom/Dockerfile
  image: piglor-loom:local
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: &environment
    LOOM_DATABASE_URL: postgresql://loom:${LOOM_POSTGRES_PASSWORD:?required}@loom-db:5432/loom
    LOOM_ORGANIZATION: ${LOOM_ORGANIZATION:-local}

services:
  loom-db:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: loom
      POSTGRES_DB: loom
      POSTGRES_PASSWORD: ${LOOM_POSTGRES_PASSWORD:?required}
    volumes: [loom-data:/var/lib/postgresql/data]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U loom -d loom"]
      interval: 10s
      timeout: 5s
      retries: 10

  loom-migrate:
    <<: *loom
    command: [migrate]
    restart: "no"
    networks: [private]
    depends_on:
      loom-backup: {condition: service_completed_successfully}

  loom-backup:
    image: postgres:17.6
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      PGHOST: loom-db
      PGUSER: loom
      PGDATABASE: loom
      PGPASSWORD: ${LOOM_POSTGRES_PASSWORD:?required}
    volumes: [loom-backups:/backups]
    networks: [private]
    depends_on:
      loom-db: {condition: service_healthy}
    entrypoint: [sh, -ec]
    command:
      - 'umask 077; backup_file=$$(mktemp /backups/pre-migration-XXXXXXXX.dump); pg_dump --format=custom --file="$$backup_file"; pg_restore --list "$$backup_file" >/dev/null; echo "Loom pre-migration backup validated"'

  loom-server:
    <<: *loom
    command: [serve]
    environment:
      <<: *environment
      LOOM_API_TOKEN: ${LOOM_API_TOKEN:?required}
      LOOM_GITHUB_WEBHOOK_SECRET: ${LOOM_GITHUB_WEBHOOK_SECRET:-}
      LOOM_GITHUB_API_TOKEN: ${LOOM_GITHUB_API_TOKEN:-}
    expose: [8080]
    networks: [private, egress]
    depends_on:
      loom-migrate: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - /loom-server
        - healthcheck
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  loom-worker:
    <<: *loom
    command: [worker]
    environment:
      <<: *environment
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?required}
      HATCHET_CLIENT_SERVER_URL: ${HATCHET_CLIENT_SERVER_URL:-https://hatchet.piglor.com}
      HATCHET_CLIENT_HOST_PORT: ${HATCHET_CLIENT_HOST_PORT:-hatchet-engine:7070}
      HATCHET_CLIENT_TLS_STRATEGY: ${HATCHET_CLIENT_TLS_STRATEGY:-none}
    networks: [private, hatchet-existing]
    depends_on:
      loom-migrate: {condition: service_completed_successfully}

volumes:
  loom-data:
  loom-backups:

networks:
  private:
    internal: true
  egress:
  hatchet-existing:
    external: true
    name: ${HATCHET_NETWORK:?set existing Docker network name}
