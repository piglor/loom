# Merge with compose.yaml. Route the public console domain to loom-console:8080.
# Keep the Python API private as the mutation authority during migration.
services:
  loom-console:
    build:
      context: ../..
      dockerfile: services/loom/Dockerfile
    image: piglor-loom-console:local
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      LOOM_DATABASE_URL: postgresql://loom:${LOOM_POSTGRES_PASSWORD:?required}@loom-db:5432/loom
      LOOM_API_TOKEN: ${LOOM_API_TOKEN:?required}
      LOOM_ORGANIZATION: ${LOOM_ORGANIZATION:-local}
      LOOM_UPSTREAM_URL: http://loom-server:8000
    expose: [8080]
    networks: [private, hatchet-existing]
    depends_on:
      loom-server: {condition: service_healthy}
    healthcheck:
      test: [CMD, /loom-server, healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
