[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "piglor-loom"
version = "0.1.0"
description = "Pay for thinking, not waiting: a durable control plane for agents"
requires-python = ">=3.12"
dependencies = [
  "hatchet-sdk==1.40.0",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]

[project.scripts]
loom = "loom.cli:main"

[tool.setuptools.packages.find]
where = ["server"]

[tool.setuptools.package-data]
loom = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
