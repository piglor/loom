services:
  # Development-only OpenBao. Lite/Server must not use dev mode or this token.
  openbao:
    image: openbao/openbao:2.5.4
    command: ["server", "-dev", "-dev-listen-address=0.0.0.0:8200", "-dev-root-token-id=loom-development-root-token"]
    ports:
      - "127.0.0.1:18200:8200"
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  loom-postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: ${LOOM_POSTGRES_PASSWORD:?Run loom init first}
      POSTGRES_DB: loom
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - loom-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

volumes:
  loom-data:
