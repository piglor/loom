name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  durable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired language artifacts
        run: |
          test -z "$(find . -path ./.git -prune -o -path ./node_modules -prune -o -path ./target -prune -o -name '*.py' -print)"
          test ! -e pyproject.toml
          test ! -e requirements.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - name: Go API race and static checks
        working-directory: services/loom
        run: |
          test -z "$(gofmt -l .)"
          go generate ./ent
          git diff --exit-code -- ent
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build console assets for gateway recovery proofs
        run: npm ci && npm run build
      - name: Install pinned Hatchet CLI
        run: curl -fsSL https://install.hatchet.run/install.sh | HATCHET_CLI_TELEMETRY_ENABLED=false bash -s -- v0.105.16
      - name: Install Loom dependencies
        run: make setup
      - name: Rust agent checks
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Generic Goal wait and exact Session lifecycle against PostgreSQL
        working-directory: services/loom
        run: go test -race ./internal/control -count=1
      - name: Validate deployment descriptors
        run: ./scripts/verify_deployment_config.sh
      - name: Calculate source fingerprint
        id: source-fingerprint
        run: echo "sha=$(sh scripts/source_fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - name: Build pinned OpenBao deployment image
        run: docker build --pull -f deploy/openbao/Dockerfile -t loom-openbao:ci .
      - name: Build Go console container
        run: docker build --build-arg LOOM_BUILD_SHA=${GITHUB_SHA:-development} -f services/loom/Dockerfile -t piglor-loom-console:local .
      - name: Run image, signed ingress, and backup/restore acceptance
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source-fingerprint.outputs.sha }}
        run: ./scripts/verify_image.sh piglor-loom-console:local
  publish-image:
    needs: [durable-core, console]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: loom-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Calculate source fingerprint
        id: source-fingerprint
        run: echo "sha=$(sh scripts/source_fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Loom image
        id: console-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/loom/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/piglor/loom:sha-${{ github.sha }}
          build-args: LOOM_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/piglor/loom
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.console-image.outputs.digest }}
        run: echo "ghcr.io/piglor/loom@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Request Coolify production deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_OPENBAO_SERVICE_UUID: ${{ vars.COOLIFY_OPENBAO_SERVICE_UUID || secrets.COOLIFY_OPENBAO_SERVICE_UUID }}
          COOLIFY_OPENBAO_DOMAIN: ${{ vars.COOLIFY_OPENBAO_DOMAIN || secrets.COOLIFY_OPENBAO_DOMAIN }}
          COOLIFY_PROJECT_UUID: ${{ vars.COOLIFY_PROJECT_UUID || secrets.COOLIFY_PROJECT_UUID }}
          COOLIFY_ENVIRONMENT_UUID: ${{ vars.COOLIFY_ENVIRONMENT_UUID || secrets.COOLIFY_ENVIRONMENT_UUID }}
          COOLIFY_SERVER_UUID: ${{ vars.COOLIFY_SERVER_UUID || secrets.COOLIFY_SERVER_UUID }}
          COOLIFY_DESTINATION_UUID: ${{ vars.COOLIFY_DESTINATION_UUID || secrets.COOLIFY_DESTINATION_UUID }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN is not configured; refusing to report production success."
            exit 1
          fi
          compose_b64=$(base64 --wrap=0 deploy/coolify/compose.yaml)
          openbao_compose_b64=$(base64 --wrap=0 deploy/coolify/openbao.compose.yaml)
          coolify_api=https://coolify.piglor.com/api/v1
          loom_service_uuid=yidv3el41pezd8qp22s6el2w
          auth_headers=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json")

          # Keep OpenBao as its own Coolify resource. If a UUID is not supplied,
          # discover the existing resource by name or create it beside Loom,
          # using the same project/environment/server placement.
          loom_service=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            "${auth_headers[@]}" "$coolify_api/services/$loom_service_uuid")
          environment_id=$(printf '%s' "$loom_service" | jq -er '.environment_id')
          server_id=$(printf '%s' "$loom_service" | jq -er '.server_id')
          destination_id=$(printf '%s' "$loom_service" | jq -r '.destination_id // empty')
          project_uuid="${COOLIFY_PROJECT_UUID:-}"
          environment_uuid="${COOLIFY_ENVIRONMENT_UUID:-}"
          server_uuid="${COOLIFY_SERVER_UUID:-}"
          destination_uuid="${COOLIFY_DESTINATION_UUID:-}"
          if [ -z "$project_uuid" ] || [ -z "$environment_uuid" ]; then
            # GET /services/{uuid} exposes numeric placement IDs, not project or
            # environment UUIDs. Resolve those IDs through the documented APIs.
            projects=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
              "${auth_headers[@]}" "$coolify_api/projects")
            while IFS= read -r candidate_project; do
              [ -n "$candidate_project" ] || continue
              environments=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
                "${auth_headers[@]}" "$coolify_api/projects/$candidate_project/environments")
              environment=$(printf '%s' "$environments" | jq -r --arg id "$environment_id" \
                '[.[] | select((.id | tostring) == $id)][0] // empty')
              if [ -n "$environment" ]; then
                project_uuid="$candidate_project"
                environment_uuid=$(printf '%s' "$environment" | jq -er '.uuid')
                environment_name=$(printf '%s' "$environment" | jq -er '.name')
                break
              fi
            done < <(printf '%s' "$projects" | jq -r '.[].uuid')
          else
            environment_name=$(printf '%s' "$loom_service" | jq -r '.environment_name // "production"')
          fi
          if [ -z "$project_uuid" ] || [ -z "$environment_uuid" ]; then
            echo "::error::Could not resolve Loom's Coolify project/environment placement. Set COOLIFY_PROJECT_UUID and COOLIFY_ENVIRONMENT_UUID."
            exit 1
          fi
          if [ -z "$server_uuid" ]; then
            servers=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
              "${auth_headers[@]}" "$coolify_api/servers")
            server_uuid=$(printf '%s' "$servers" | jq -r --arg id "$server_id" \
              '[.[] | select((.id | tostring) == $id)][0].uuid // empty')
          fi
          if [ -z "$server_uuid" ]; then
            echo "::error::Could not resolve Loom's Coolify server placement. Set COOLIFY_SERVER_UUID."
            exit 1
          fi
          if [ -z "$destination_uuid" ] && [ -n "$destination_id" ]; then
            destinations=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
              "${auth_headers[@]}" "$coolify_api/servers/$server_uuid/destinations")
            destination_uuid=$(printf '%s' "$destinations" | jq -r --arg id "$destination_id" \
              '[.[] | select((.id | tostring) == $id)][0].uuid // empty')
          fi
          if [ -n "$destination_id" ] && [ -z "$destination_uuid" ]; then
            echo "::error::Could not resolve Loom's Coolify destination placement. Set COOLIFY_DESTINATION_UUID."
            exit 1
          fi
          if [ -z "$environment_name" ]; then
            environment_name=$(printf '%s' "$loom_service" | jq -r '.environment_name // "production"')
          fi
          openbao_uuid="${COOLIFY_OPENBAO_SERVICE_UUID:-}"
          if [ -z "$openbao_uuid" ]; then
            services=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
              "${auth_headers[@]}" "$coolify_api/services")
            openbao_uuid=$(printf '%s' "$services" | jq -r \
              --arg name loom-openbao --arg environment_id "$environment_id" \
              --arg server_id "$server_id" --arg destination_id "$destination_id" \
              '[.[] | select(.name == $name and (.environment_id | tostring) == $environment_id and (.server_id | tostring) == $server_id and ($destination_id == "" or (.destination_id | tostring) == $destination_id)) | .uuid][0] // empty')
          fi
          openbao_domain="${COOLIFY_OPENBAO_DOMAIN:-openbao.piglor.com}"
          if ! printf '%s' "$openbao_domain" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "::error::COOLIFY_OPENBAO_DOMAIN must be a DNS hostname without a scheme or path."
            exit 1
          fi
          openbao_addr="https://${openbao_domain}"
          if [ -z "$openbao_uuid" ]; then
            create_payload=$(jq -n \
              --arg name loom-openbao \
              --arg description "Loom OpenBao integration secret store" \
              --arg project_uuid "$project_uuid" \
              --arg environment_name "$environment_name" \
              --arg environment_uuid "$environment_uuid" \
              --arg server_uuid "$server_uuid" \
              --arg destination_uuid "$destination_uuid" \
              --arg compose "$openbao_compose_b64" \
              --arg domain "$openbao_addr" \
              '{name:$name, description:$description, project_uuid:$project_uuid,
                environment_name:$environment_name,
                environment_uuid:$environment_uuid, server_uuid:$server_uuid,
                docker_compose_raw:$compose, instant_deploy:false,
                connect_to_docker_network:false,
                urls:[{name:"openbao",url:$domain}],
                is_container_label_escape_enabled:false}
               + (if $destination_uuid != "" then {destination_uuid:$destination_uuid} else {} end)')
            openbao_response=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
              -X POST "${auth_headers[@]}" -H "Content-Type: application/json" \
              --data "$create_payload" "$coolify_api/services")
            openbao_uuid=$(printf '%s' "$openbao_response" | jq -er '.uuid')
            echo "Created dedicated OpenBao Coolify service $openbao_uuid."
          else
            update_payload=$(jq -n --arg compose "$openbao_compose_b64" --arg domain "$openbao_addr" \
              '{docker_compose_raw:$compose, connect_to_docker_network:false,
                urls:[{name:"openbao",url:$domain}], force_domain_override:false,
                is_container_label_escape_enabled:false}')
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH "${auth_headers[@]}" -H "Content-Type: application/json" \
              --data "$update_payload" "$coolify_api/services/$openbao_uuid"
            echo "Updated dedicated OpenBao Coolify service $openbao_uuid."
          fi
          openbao_envs=$(jq -n --arg ref "$GITHUB_SHA" --arg addr "$openbao_addr" \
            '{data:[
              {key:"LOOM_SOURCE_REF",value:$ref,is_preview:false,is_literal:true},
              {key:"OPENBAO_API_ADDR",value:$addr,is_preview:false,is_literal:true}
            ]}')
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH "${auth_headers[@]}" -H "Content-Type: application/json" \
            --data "$openbao_envs" "$coolify_api/services/$openbao_uuid/envs/bulk"
          openbao_source_ref=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            "${auth_headers[@]}" "$coolify_api/services/$openbao_uuid/envs" | jq -r \
            'first(.[] | select(.key == "LOOM_SOURCE_REF") | (.real_value // .value // "")) // ""')
          if [ "$openbao_source_ref" != "$GITHUB_SHA" ]; then
            echo "::error::OpenBao resource did not retain the commit-pinned source reference."
            exit 1
          fi
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X GET "${auth_headers[@]}" \
            "$coolify_api/deploy?uuid=$openbao_uuid&force=true"
          bao_deadline=$((SECONDS + 300))
          bao_ready=false
          while (( SECONDS < bao_deadline )); do
            bao_code=$(curl --silent --show-error --max-time 10 \
              -o /dev/null -w '%{http_code}' "https://${openbao_domain}/v1/sys/health" || true)
            case "$bao_code" in
              200|429|501|503)
                bao_ready=true
                echo "OpenBao HTTPS endpoint is reachable (HTTP $bao_code)."
                break
                ;;
              *)
                echo "Waiting for OpenBao HTTPS endpoint (HTTP ${bao_code:-unreachable})."
                sleep 10
                ;;
            esac
          done
          if [ "$bao_ready" != true ]; then
            echo "::error::OpenBao service $openbao_uuid did not become reachable at https://${openbao_domain}."
            exit 1
          fi

          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"docker_compose_raw\":\"$compose_b64\"}" \
            "$coolify_api/services/$loom_service_uuid"
          # Coolify materializes the :?required error text as an environment
          # value when a new variable has not been configured yet. Remove only
          # that exact placeholder; never overwrite a real operator value.
          service_envs=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            "${auth_headers[@]}" "$coolify_api/services/$loom_service_uuid/envs")
          placeholder_envs=$(printf '%s' "$service_envs" | jq -c '[.[] | select((.value // .real_value // "") == "required") | {key, value: (if .key == "LOOM_PUBLIC_URL" then "https://loom.piglor.com" else "" end), is_preview: false, is_literal: true}]')
          if [ "$placeholder_envs" != "[]" ]; then
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "{\"data\":$placeholder_envs}" \
              "$coolify_api/services/$loom_service_uuid/envs/bulk"
          fi
          openbao_addr_present=$(printf '%s' "$service_envs" | jq -r \
            'first(.[] | select(.key == "LOOM_OPENBAO_ADDR") | (.real_value // .value // "")) // ""')
          if [ -z "$openbao_addr_present" ]; then
            loom_openbao_envs=$(jq -n --arg addr "$openbao_addr" \
              '{data:[
                {key:"LOOM_OPENBAO_ADDR",value:$addr,is_preview:false,is_literal:true},
                {key:"LOOM_OPENBAO_MOUNT",value:"loom",is_preview:false,is_literal:true}
              ]}')
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH "${auth_headers[@]}" -H "Content-Type: application/json" \
              --data "$loom_openbao_envs" "$coolify_api/services/$loom_service_uuid/envs/bulk"
          fi
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"data\":[{\"key\":\"LOOM_BUILD_SHA\",\"value\":\"$GITHUB_SHA\",\"is_preview\":false,\"is_literal\":true},{\"key\":\"LOOM_SOURCE_REF\",\"value\":\"$GITHUB_SHA\",\"is_preview\":false,\"is_literal\":true}]}" \
            "$coolify_api/services/$loom_service_uuid/envs/bulk"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X GET \
            "${auth_headers[@]}" \
            "$coolify_api/deploy?uuid=$loom_service_uuid&force=true"
      - name: Verify public production revision
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source-fingerprint.outputs.sha }}
        run: |
          deadline=$((SECONDS + 600))
          attempt=0
          while :; do
            remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || break
            request_timeout=$(( remaining < 10 ? remaining : 10 ))
            attempt=$((attempt + 1))
            if response=$(curl --fail --silent --show-error --max-time "$request_timeout" https://loom.piglor.com/healthz); then
              if printf '%s' "$response" | grep -Fq "\"build_sha\":\"$EXPECTED_BUILD_SHA\"" && printf '%s' "$response" | grep -Fq "\"source_sha\":\"$EXPECTED_SOURCE_SHA\""; then
                echo "Public production is serving $EXPECTED_BUILD_SHA."
                exit 0
              fi
              echo "Waiting for public production to serve $EXPECTED_BUILD_SHA (attempt $attempt): $response"
            else
              echo "Waiting for public production health (attempt $attempt)."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 10 )); then sleep 10; elif (( remaining > 0 )); then sleep "$remaining"; fi
          done
          echo "::error::Public production did not serve $EXPECTED_BUILD_SHA within 10 minutes."
          exit 1
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check apps/web/src apps/web/tests apps/web/smoke apps/web/playwright.config.ts apps/web/playwright.smoke.config.ts packages/client/src
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: 72 browser regression and smoke checks (four profiles, no production credentials)
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-test-results
          path: apps/web/test-results
