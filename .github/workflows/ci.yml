name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  durable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - name: Go API race and static checks
        working-directory: services/loom
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Build console assets for gateway recovery proofs
        run: npm ci && npm run build
      - name: Install pinned Hatchet CLI
        run: curl -fsSL https://install.hatchet.run/install.sh | HATCHET_CLI_TELEMETRY_ENABLED=false bash -s -- v0.105.16
      - name: Install Loom
        run: make setup
      - name: Rust agent checks
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Generate local test credentials
        run: make init
      - name: Start real PostgreSQL and Hatchet
        run: make infra migrate
      - name: Lint and format
        run: make check
      - name: Domain and API tests against isolated PostgreSQL database
        run: make test
      - name: Real Hatchet restart and suspension proof
        run: make prove
      - name: Repeatable finite runtime, Go reader parity, and gateway restart proof
        run: make prove-repeatable
      - name: Real outbound Rust worker restart proof
        run: make prove-remote
      - name: Repeatable protocol outbound Rust worker restart proof
        run: LOOM_PROOF_PROTOCOL=2 make prove-remote
      - name: Real durable restart through Go entry point
        run: make prove-go
      - name: Real remote worker through Go entry point
        run: make prove-go-remote
      - name: Non-root read-only container smoke test
        run: make prove-container
      - name: PostgreSQL backup and restore drill
        run: make prove-backup
      - name: Build Go console container
        run: docker build -f services/loom/Dockerfile -t piglor-loom-console:local .
      - name: Go container restart and API proof
        run: .venv/bin/python -m scripts.prove_go_container
  publish-image:
    needs: [durable-core, console]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Linux image
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/piglor/loom:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/piglor/loom
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Check published artifact
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges \
            --entrypoint python "ghcr.io/piglor/loom@$IMAGE_DIGEST" \
            -c 'import os, loom.api, loom.worker; assert os.getuid() == 10001; print("Published Loom artifact verified")'
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: echo "ghcr.io/piglor/loom@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish tested Go console image
        id: console-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/loom/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/piglor/loom-console:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/piglor/loom
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable console image
        env:
          IMAGE_DIGEST: ${{ steps.console-image.outputs.digest }}
        run: echo "ghcr.io/piglor/loom-console@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check apps/web/src apps/web/tests apps/web/smoke apps/web/playwright.config.ts apps/web/playwright.smoke.config.ts packages/client/src
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: 72 browser regression and smoke checks (four profiles, no production credentials)
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-test-results
          path: apps/web/test-results
