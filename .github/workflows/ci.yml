name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  durable-core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Reject retired language artifacts
        run: |
          test -z "$(find . -path ./.git -prune -o -path ./node_modules -prune -o -path ./target -prune -o -name '*.py' -print)"
          test ! -e pyproject.toml
          test ! -e requirements.lock
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - name: Go API race and static checks
        working-directory: services/loom
        run: |
          test -z "$(gofmt -l .)"
          go generate ./ent
          git diff --exit-code -- ent
          go vet ./...
          go test -race ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Build console assets for gateway recovery proofs
        run: npm ci && npm run build
      - name: Install pinned Hatchet CLI
        run: curl -fsSL https://install.hatchet.run/install.sh | HATCHET_CLI_TELEMETRY_ENABLED=false bash -s -- v0.105.16
      - name: Install Loom dependencies
        run: make setup
      - name: Rust agent checks
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt --component clippy
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Generic Goal wait and exact Session lifecycle against PostgreSQL
        working-directory: services/loom
        run: go test -race ./internal/control -count=1
      - name: Validate deployment descriptors
        run: ./scripts/verify_deployment_config.sh
      - name: Calculate source fingerprint
        id: source-fingerprint
        run: echo "sha=$(sh scripts/source_fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - name: Build pinned OpenBao deployment image
        run: docker build --pull -f deploy/openbao/Dockerfile -t loom-openbao:ci .
      - name: Build Go console container
        run: docker build --build-arg LOOM_BUILD_SHA=${GITHUB_SHA:-development} -f services/loom/Dockerfile -t piglor-loom-console:local .
      - name: Run image, signed ingress, and backup/restore acceptance
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source-fingerprint.outputs.sha }}
        run: ./scripts/verify_image.sh piglor-loom-console:local
  publish-image:
    needs: [durable-core, console]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: loom-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Calculate source fingerprint
        id: source-fingerprint
        run: echo "sha=$(sh scripts/source_fingerprint.sh)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested Loom image
        id: console-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/loom/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/piglor/loom:sha-${{ github.sha }}
          build-args: LOOM_BUILD_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/piglor/loom
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
          sbom: true
      - name: Record immutable image
        env:
          IMAGE_DIGEST: ${{ steps.console-image.outputs.digest }}
        run: echo "ghcr.io/piglor/loom@$IMAGE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - name: Request Coolify production deployment
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "::error::COOLIFY_API_TOKEN is not configured; refusing to report production success."
            exit 1
          fi
          compose_b64=$(base64 --wrap=0 deploy/coolify/compose.yaml)
          coolify_api=https://coolify.piglor.com/api/v1
          loom_service_uuid=yidv3el41pezd8qp22s6el2w
          auth_headers=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json")

          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"docker_compose_raw\":\"$compose_b64\"}" \
            "$coolify_api/services/$loom_service_uuid"
          # The Coolify proxy lives on its predefined `coolify` network. Keep
          # this enabled for the bundled Compose resource so the server remains
          # reachable even though the stack also declares private networks.
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data '{"connect_to_docker_network":true}' \
            "$coolify_api/services/$loom_service_uuid"
          # Coolify materializes the :?required error text as an environment
          # value when a new variable has not been configured yet. Remove only
          # that exact placeholder; never overwrite a real operator value.
          service_envs=$(curl --fail-with-body --retry 3 --retry-delay 5 --silent --show-error \
            "${auth_headers[@]}" "$coolify_api/services/$loom_service_uuid/envs")
          placeholder_envs=$(printf '%s' "$service_envs" | jq -c '[.[] | select((.value // .real_value // "") == "required") | {key, value: (if .key == "LOOM_PUBLIC_URL" then "https://loom.piglor.com" else "" end), is_preview: false, is_literal: true}]')
          if [ "$placeholder_envs" != "[]" ]; then
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH \
              "${auth_headers[@]}" \
              -H "Content-Type: application/json" \
              --data "{\"data\":$placeholder_envs}" \
              "$coolify_api/services/$loom_service_uuid/envs/bulk"
          fi
          openbao_addr_present=$(printf '%s' "$service_envs" | jq -r \
            'first(.[] | select(.key == "LOOM_OPENBAO_ADDR") | (.real_value // .value // "")) // ""')
          if [ -z "$openbao_addr_present" ]; then
            loom_openbao_envs=$(jq -n \
              '{data:[
                {key:"LOOM_OPENBAO_ADDR",value:"http://openbao:8200",is_preview:false,is_literal:true},
                {key:"LOOM_OPENBAO_MOUNT",value:"loom",is_preview:false,is_literal:true}
              ]}')
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH "${auth_headers[@]}" -H "Content-Type: application/json" \
            --data "$loom_openbao_envs" "$coolify_api/services/$loom_service_uuid/envs/bulk"
          fi
          ingress_network_present=$(printf '%s' "$service_envs" | jq -r \
            'first(.[] | select(.key == "LOOM_INGRESS_NETWORK") | (.real_value // .value // "")) // ""')
          # Older runs filled this with the resource UUID before the proxy
          # network was enabled. Migrate that generated value to Coolify's
          # predefined network; keep any other value supplied by an operator.
          if [ -z "$ingress_network_present" ] || [ "$ingress_network_present" = "$loom_service_uuid" ]; then
            loom_ingress_env=$(jq -n \
              '{data:[{key:"LOOM_INGRESS_NETWORK",value:"coolify",is_preview:false,is_literal:true}]}')
            curl --fail-with-body --retry 3 --retry-delay 5 \
              -X PATCH "${auth_headers[@]}" -H "Content-Type: application/json" \
              --data "$loom_ingress_env" "$coolify_api/services/$loom_service_uuid/envs/bulk"
          fi
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X PATCH \
            "${auth_headers[@]}" \
            -H "Content-Type: application/json" \
            --data "{\"data\":[{\"key\":\"LOOM_BUILD_SHA\",\"value\":\"$GITHUB_SHA\",\"is_preview\":false,\"is_literal\":true},{\"key\":\"LOOM_SOURCE_REF\",\"value\":\"$GITHUB_SHA\",\"is_preview\":false,\"is_literal\":true}]}" \
            "$coolify_api/services/$loom_service_uuid/envs/bulk"
          curl --fail-with-body --retry 3 --retry-delay 5 \
            -X GET \
            "${auth_headers[@]}" \
            "$coolify_api/deploy?uuid=$loom_service_uuid&force=true"
      - name: Verify public production revision
        env:
          EXPECTED_BUILD_SHA: ${{ github.sha }}
          EXPECTED_SOURCE_SHA: ${{ steps.source-fingerprint.outputs.sha }}
        run: |
          deadline=$((SECONDS + 600))
          attempt=0
          while :; do
            remaining=$((deadline - SECONDS))
            (( remaining > 0 )) || break
            request_timeout=$(( remaining < 10 ? remaining : 10 ))
            attempt=$((attempt + 1))
            if response=$(curl --fail --silent --show-error --max-time "$request_timeout" https://loom.piglor.com/healthz); then
              if printf '%s' "$response" | grep -Fq "\"build_sha\":\"$EXPECTED_BUILD_SHA\"" && printf '%s' "$response" | grep -Fq "\"source_sha\":\"$EXPECTED_SOURCE_SHA\""; then
                echo "Public production is serving $EXPECTED_BUILD_SHA."
                exit 0
              fi
              echo "Waiting for public production to serve $EXPECTED_BUILD_SHA (attempt $attempt): $response"
            else
              echo "Waiting for public production health (attempt $attempt)."
            fi
            remaining=$((deadline - SECONDS))
            if (( remaining > 10 )); then sleep 10; elif (( remaining > 0 )); then sleep "$remaining"; fi
          done
          echo "::error::Public production did not serve $EXPECTED_BUILD_SHA within 10 minutes."
          exit 1
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/loom/go.mod
          cache-dependency-path: services/loom/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx prettier --check apps/web/src apps/web/tests apps/web/smoke apps/web/playwright.config.ts apps/web/playwright.smoke.config.ts packages/client/src
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: 72 browser regression and smoke checks (four profiles, no production credentials)
        run: npm run test:web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: console-test-results
          path: apps/web/test-results
