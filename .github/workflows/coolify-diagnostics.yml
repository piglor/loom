name: Coolify diagnostics

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Loom service without exposing secrets
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_TOKEN"
          api=https://coolify.piglor.com/api/v1
          uuid=yidv3el41pezd8qp22s6el2w
          headers=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H "Accept: application/json")

          service=$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/services/$uuid")
          printf '%s' "$service" | jq '{uuid,name,environment_id,server_id,destination_id,connect_to_docker_network,config_hash,service_type,updated_at,domains:(.domains // .docker_compose_domains),applications:[.applications[]? | {uuid,name,human_name,status,domains:(.domains // .fqdn),ports_exposes,ports_mappings,custom_labels}],databases:[.databases[]? | {uuid,name,human_name,status}]}'

          envs=$(curl --fail-with-body --silent --show-error "${headers[@]}" "$api/services/$uuid/envs")
          printf '%s' "$envs" | jq '[.[] | {key, is_preview, is_literal, configured: (((.real_value // .value // "") | length) > 0)}]'

          while IFS=$'\t' read -r sub_uuid sub_service; do
            echo "--- logs: $sub_service ($sub_uuid) ---"
            curl --fail-with-body --silent --show-error "${headers[@]}" "$api/services/$uuid/applications/$sub_uuid/logs?lines=120&show_timestamps=true" \
              | jq -r '.logs // .message // "(no logs)"' || true
          done <<EOF
$(printf '%s' "$service" | jq -r '.applications[]? | [.uuid,.name] | @tsv')
EOF

          echo "--- active deployments ---"
          curl --fail-with-body --silent --show-error "${headers[@]}" "$api/deployments" \
            | jq '[.[] | select((.application_name // "") | test("loom"; "i")) | {deployment_uuid,status,created_at,updated_at,commit,application_name,logs:(.logs // "" | split("\\n") | .[-40:])}]'
